name: Deploy bot de Telegram

# Despliega el worker del bot cuando cambia. Los secretos de runtime se
# re-declaran en cada corrida (idempotente). El registro del webhook queda
# para el final y se salta si aún no existe TELEGRAM_BOT_TOKEN en secrets.
on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - ".github/workflows/deploy-bot.yml"
  workflow_dispatch:

concurrency:
  group: deploy-bot
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy del worker
        run: npx -y wrangler@latest deploy --config workers/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # wrangler secret put es no-interactivo leyendo de stdin y es idempotente
      - name: Secretos de runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_WEBHOOK_SECRET: ${{ secrets.BOT_WEBHOOK_SECRET }}
        run: |
          cfg="--config workers/wrangler.toml"
          for nombre in SUPABASE_URL SUPABASE_SERVICE_KEY NAN_API_KEY TELEGRAM_BOT_TOKEN BOT_WEBHOOK_SECRET; do
            valor="${!nombre}"
            if [ -z "$valor" ]; then
              echo "$nombre sin definir en secrets: se omite"
              continue
            fi
            printf '%s' "$valor" | npx -y wrangler@latest secret put "$nombre" $cfg
          done

      # El webhook apunta al URL de workers.dev del bot; sin TELEGRAM_BOT_TOKEN
      # (primera instalación) se omite y queda pendiente para la próxima corrida.
      - name: Registrar webhook de Telegram
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_WEBHOOK_SECRET: ${{ secrets.BOT_WEBHOOK_SECRET }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "sin TELEGRAM_BOT_TOKEN: webhook pendiente"
            exit 0
          fi
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain')
          URL="https://apagones-bot.${SUB}.workers.dev/webhook/$BOT_WEBHOOK_SECRET"
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook" -d "url=$URL"
          echo "webhook -> $URL"
