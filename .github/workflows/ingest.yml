name: Ingesta EELH

# UN SOLO disparador: el cron-worker de Cloudflare, vía workflow_dispatch.
#
# Antes había también un "schedule" cada 30 min y los dos se pisaban: con
# cancel-in-progress, cada disparo mata el run anterior, así que una ingesta que
# necesita ~18 min nunca sobrevivía a una ventana con un disparo cada ~15.
# Medido sobre 60 runs: el cron de GitHub llega 14.5 min tarde de media (peor
# caso 26.6) sobre un intervalo de 30, mientras el dispatch del worker llega a
# los 3.9. Quitar el impuntual es lo que permite que un run llegue al final.
on:
  workflow_dispatch:

concurrency:
  group: ingesta
  cancel-in-progress: true   # el nuevo mata al viejo, así siempre corre el último

permissions:
  contents: write  # push de la caché de geocodificación de averías

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 25 min: sin el schedule pisando, la ventana real entre disparos es de 30.
    # Una ingesta completa medida ronda los 18, así que 20 dejaba casi nada de
    # margen para un proveedor LLM lento.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r ingestor/requirements.txt

      # Tests de regresión ANTES de tocar nada. Sin "|| echo": si fallan, el job
      # se detiene y NO se publica. Es deliberado: más vale no actualizar la web
      # que publicar estado equivocado, que es justo lo que pasó cuando el
      # refuerzo del LLM quedó desconectado y nadie se enteró en semanas.
      # Son unittest puros, sin red ni credenciales: tardan menos de un segundo.
      - name: Tests de regresión
        run: python -m unittest discover -s tests

      - run: python ingestor/ingest.py
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Transcripción de mensajes de voz (best-effort)
      - run: python scripts/audio_a_texto.py || echo "audio_a_texto falló, se continúa"
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}

      - run: python extractor/extract.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Extracción LLM de partes oficiales (best-effort; caché por message_id).
      # Va ANTES que comentarios_llm: si la cuota gratis escasea, los partes
      # oficiales tienen prioridad sobre los comentarios.
      - run: python scripts/partes_llm.py || echo "LLM partes falló, se continúa"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}

      # Comparador regex vs LLM: registra discrepancias para la verificación diaria
      - run: python scripts/comparar_extraccion.py || echo "comparador falló, se continúa"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Enriquecimiento LLM de comentarios (best-effort: no debe tumbar el pipeline)
      - run: python scripts/comentarios_llm.py || echo "LLM comentarios falló, se continúa"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}

      - run: python scripts/estado.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - run: python scripts/build_barrios.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - run: python scripts/build_analitica.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}

      # Índice semántico del chat en Supabase/pgvector (best-effort).
      # Incremental y acotado por reloj: solo indexa lo nuevo o lo que cambió.
      # Si no se ha ejecutado ingestor/schema_chatbot.sql, avisa y sigue.
      - run: python scripts/chatbot/embeddings.py || echo "chatbot embeddings falló, se continúa"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}

      # Primero el catálogo: build_partes conserva luego la última mención
      # enlazada por cada circuito, aunque haya salido de su ventana de 7 días.
      - run: python scripts/build_circuitos.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Última red antes de publicar: si el catálogo contradice lo que el LLM
      # extrajo (evidencia del código escrito en el parte), se corrige aquí.
      # Con el pipeline sano no corrige nada; si empieza a corregir, es que algo
      # aguas arriba se rompió y el contador del log lo dice.
      - run: python scripts/coherencia_catalogo.py

      # Agregados compactos que consulta el chat (analitica.json son ~4 MB y el
      # worker no puede descargarlos por mensaje). Va DESPUÉS de
      # build_circuitos porque necesita el estado/estado_fecha por circuito del
      # catálogo recién hecho (la cola del corte abierto de horas_dia); si corre
      # antes, lee el circuitos.json commiteado, que puede tener semanas.
      - run: python scripts/build_bot_datos.py || echo "bot_datos falló, se continúa"

      - run: python scripts/build_partes.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Purga de datos viejos (retenciones en scripts/purga.py). Va al FINAL:
      # los cachés incrementales (analitica_raw, canal_cache) son la copia del
      # histórico que la DB va a borrar, y si no están frescos la purga se
      # auto-deshabilita. PURGA_DRY_RUN=1 en el primer despliegue si se quiere
      # ver solo los conteos.
      - run: python scripts/purga.py || echo "purga falló, se continúa"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # Persiste las cachés de geocodificación (averías + circuitos) para no repetir
      # consultas a Nominatim/Overpass. Es BEST-EFFORT: si hay conflicto con otra
      # corrida (ambas tocan la caché), se resuelve tomando lo entrante y nunca
      # falla el job (la caché es regenerable) -> el deploy de abajo siempre corre.
      #
      # always(): corre aunque un step anterior muera o el job sea cancelado. Sin
      # esto, un timeout a mitad de la ingesta descartaba TODO el trabajo LLM ya
      # hecho, y la corrida siguiente reprocesaba lo mismo para volver a morir.
      - if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/geocache_averias.json data/geocache_circuitos_lineas.json data/geocache_lineas_intentos.json data/partes_llm.json data/discrepancias_extraccion.json data/llm_cuota.json data/cambios_direccion.json data/conteo_usuario.json data/analitica_raw.json data/canal_cache.json data/chatbot_hashes.json || true
          if ! git diff --cached --quiet; then
            git commit -m "caché de geocodificación [skip ci]"
            git pull --rebase --autostash -X theirs || git rebase --abort || true
            git push || true
          fi
        continue-on-error: true

      # SEO estático (best-effort): regenera las regiones inyectadas, las 15
      # páginas de municipio y sitemap/robots EN EL ÁRBOL DE TRABAJO (nada se
      # commitea; wrangler sube web/ con --commit-dirty). Como todo paso no
      # crítico: si revienta, se despliega el último HTML bueno y los datos de
      # apagones no se bloquean jamás por culpa del SEO.
      - run: python3 scripts/build_seo.py || echo "seo falló, se continúa"

      # Hosting: Cloudflare Pages (accesible desde Cuba, sirve web + tiles del
      # mismo origen). Ya no usamos GitHub Pages: los tiles son .pbf servidos
      # desde Cloudflare, así que nada depende de github.io.
      - run: npx -y wrangler@latest pages deploy web --project-name apagones-habana --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
